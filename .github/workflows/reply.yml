name: Threads Reply

# 내 글에 달린 댓글에 자동 답글.
# 안티봇: 3개 슬롯 중 하루 하나만 실제 실행. 나머지는 즉시 종료해 분을 아낀다.

"on":
  schedule:
    # KST 10:19 / 16:53 / 22:07
    #   발행 슬롯(08:23/12:47/20:31)과 겹치지 않게 배치.
    - cron: "19 1 * * *"
    - cron: "53 7 * * *"
    - cron: "07 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [dry_run, live]
        default: dry_run

permissions:
  contents: read

concurrency:
  group: threads-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # BUILD 기둥 제거로 커밋 로그는 현재 미사용.
          # 기둥을 되살릴 때를 대비해 depth 는 유지한다(비용 없음).
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resolve slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "19 1 * * *")  echo "slot=A" >> "$GITHUB_OUTPUT" ;;
            "53 7 * * *")  echo "slot=B" >> "$GITHUB_OUTPUT" ;;
            "07 13 * * *") echo "slot=C" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=MANUAL" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Reply
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_LONG_LIVED_TOKEN: ${{ secrets.THREADS_LONG_LIVED_TOKEN }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          TOKEN_ISSUED_AT: ${{ vars.TOKEN_ISSUED_AT }}
          CLAUDE_AI_KEY: ${{ secrets.CLAUDE_AI_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          X_URL: ${{ vars.X_URL }}
          REPLY_ENABLED: ${{ vars.REPLY_ENABLED || 'true' }}
          EVENT_NAME: ${{ github.event_name }}
          REPLY_SLOTS: "A,B,C"
          SLOT: ${{ steps.slot.outputs.slot }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch'
             && inputs.mode == 'live' && 'false'
             || vars.DRY_RUN || 'true' }}
        run: python -m src.run_reply

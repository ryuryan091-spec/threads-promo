name: Threads Reply

# 내 글에 달린 댓글에 자동 답글 (+ v1.3.0 셀프 이어쓰기, FOLLOWUP_ENABLED).
# v1.1.0: 모든 슬롯을 실행한다. 오전(09~12시)은 chat.yml 이 실행마다 답글 스윕을 수행한다.
# v1.3.0: 슬롯 3개 → 8개, 시작 전 0~10분 랜덤 지연. 응답 공백을 줄이고 답글 시각을 흩뜨린다.
# 일일 캡·저자 캡은 실행 수와 무관하게 Threads 조회로 하루 단위 유지된다.

"on":
  schedule:
    # KST D 07:31 / A 12:19 / E 14:23 / B 16:53 / F 18:37 / G 20:52 / C 22:07 / H 00:58
    #   CHAT 창(09:00~12:05) 밖. 다른 워크플로 cron 과 5분 이상 떨어뜨렸다.
    - cron: "31 22 * * *"
    - cron: "19 3 * * *"
    - cron: "23 5 * * *"
    - cron: "53 7 * * *"
    - cron: "37 9 * * *"
    - cron: "52 11 * * *"
    - cron: "07 13 * * *"
    - cron: "58 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [dry_run, live]
        default: dry_run

permissions:
  contents: read

concurrency:
  group: threads-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # v1.3.0: 시작 지연 최대 10분 + 스윕 예산 25분 + 준비 여유
    steps:
      - uses: actions/checkout@v4
        with:
          # BUILD 기둥 제거로 커밋 로그는 현재 미사용.
          # 기둥을 되살릴 때를 대비해 depth 는 유지한다(비용 없음).
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resolve slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "31 22 * * *") echo "slot=D" >> "$GITHUB_OUTPUT" ;;
            "19 3 * * *")  echo "slot=A" >> "$GITHUB_OUTPUT" ;;
            "23 5 * * *")  echo "slot=E" >> "$GITHUB_OUTPUT" ;;
            "53 7 * * *")  echo "slot=B" >> "$GITHUB_OUTPUT" ;;
            "37 9 * * *")  echo "slot=F" >> "$GITHUB_OUTPUT" ;;
            "52 11 * * *") echo "slot=G" >> "$GITHUB_OUTPUT" ;;
            "07 13 * * *") echo "slot=C" >> "$GITHUB_OUTPUT" ;;
            "58 15 * * *") echo "slot=H" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=MANUAL" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Reply
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_LONG_LIVED_TOKEN: ${{ secrets.THREADS_LONG_LIVED_TOKEN }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          TOKEN_ISSUED_AT: ${{ vars.TOKEN_ISSUED_AT }}
          TOKEN_REFRESHED_AT: ${{ secrets.TOKEN_REFRESHED_AT }}
          CLAUDE_AI_KEY: ${{ secrets.CLAUDE_AI_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          X_URL: ${{ vars.X_URL }}
          REPLY_ENABLED: ${{ vars.REPLY_ENABLED || 'true' }}
          REPLY_SCHEDULED_RUN_CAP: ${{ vars.REPLY_SCHEDULED_RUN_CAP || '6' }}
          REPLY_DAILY_CAP: ${{ vars.REPLY_DAILY_CAP || '40' }}
          REPLY_AUTHOR_DAILY_CAP: ${{ vars.REPLY_AUTHOR_DAILY_CAP || '3' }}
          REPLY_THREAD_AUTHOR_CAP: ${{ vars.REPLY_THREAD_AUTHOR_CAP || '4' }}
          FOLLOWUP_ENABLED: ${{ vars.FOLLOWUP_ENABLED || 'false' }}
          FOLLOWUP_PCT: ${{ vars.FOLLOWUP_PCT || '25' }}
          FOLLOWUP_DAILY_CAP: ${{ vars.FOLLOWUP_DAILY_CAP || '3' }}
          EVENT_NAME: ${{ github.event_name }}
          REPLY_SLOTS: "A,B,C,D,E,F,G,H"
          SLOT: ${{ steps.slot.outputs.slot }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'live' && 'false' || 'true') || (vars.DRY_RUN || 'true') }}
        run: python -m src.run_reply

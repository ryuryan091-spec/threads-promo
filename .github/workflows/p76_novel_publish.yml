# ─────────────────────────────────────────────────────────────
#  사건파일76 사건 소설(B형) — 회차·휴재 안내 카드 FB 예약 게시 (DN2026_0119 · 원고 생성 p76_novel.yml 과 분리)
#
#  매일 6회(요일 필터 없음 — 금요일 휴재는 코드가 행 단위로 막는다). 각 실행은 시각에 의존하지 않는 일만 한다:
#  게시 시각 T(게시예정일 KST 12:00, Variable PAGE76_NOVEL_PUBLISH_HHMM)의 15분~36시간 전이면 FB 예약 등록,
#  중단 체크된 예약은 T 전에 취소, T 경과 후 게시 확인 → 게시완료. 예약 실행이 늦어도 게시 시각은 FB 가 지킨다.
#  ⚠️ cron 은 UTC. 다른 워크플로·CHAT 트리거와 6분 이상 (STD-SCHED-01 — 시각을 바꾸면 이 주석도 함께 수정)
#    "3 1 * * *"   = KST 매일 10:03     "13 5 * * *"  = KST 매일 14:13     "23 9 * * *"  = KST 매일 18:23
#    "43 13 * * *" = KST 매일 22:43     "33 17 * * *" = KST 매일 02:33     "43 21 * * *" = KST 매일 06:43
#  모드(STD-MODE-02): 수동 실행 = inputs.mode / 스케줄 = vars.PAGE76_MODE → 미설정 시 dry_run
#  probe(DN2026_0119 E-1): 수동 실행에서 mode=probe 일 때만 PAGE76_PUBLISH_PROBE=true — 점검 카드 1건을 29일 뒤로
#    예약 → 목록 확인 → 삭제 → 부재 확인. 스케줄 실행에서는 식이 항상 'false' 이고 코드도 cron 값이 있으면 거부한다.
#    (probe 는 PAGE76_MODE 해석상 dry_run + 경고로 기록되며 DB-12 를 읽거나 쓰지 않는다)
#  스위치: PAGE76_ENABLED + PAGE76_NOVEL_ENABLED + PAGE76_NOVEL_PUBLISH_ENABLED (이 워크플로만 멈추려면 마지막 것을 false)
#  중단: DB-12 행 중단 체크(T 이전이면 예약 취소) · 위 Variable · Actions 에서 이 워크플로 비활성화
#  Secret: 텔레그램은 기존 운영 알림 봇·방(보내기만) · 노션 NOTION_TOKEN · Anthropic 키는 쓰지 않음
#  보안(SEC RR-06): main 브랜치에서만 · 공개 로그에는 상태·코드만 (원고·캡션·노션 ID·FB ID 없음)
# ─────────────────────────────────────────────────────────────
name: 📕 p76-novel-publish

on:
  schedule:
    - cron: "3 1 * * *"
    - cron: "13 5 * * *"
    - cron: "23 9 * * *"
    - cron: "43 13 * * *"
    - cron: "33 17 * * *"
    - cron: "43 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run=쓰기 없음 · shadow=판정·카드만(노션·게시 없음) · live=예약 게시 · probe=예약 점검(E-1)"
        type: choice
        options: ["dry_run", "shadow", "live", "probe"]
        default: "dry_run"

concurrency:
  group: p76-novel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --require-hashes -r p76/requirements.txt
      - name: Install Korean fonts (card render)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Run
        env:
          PAGE76_ENABLED: ${{ vars.PAGE76_ENABLED }}
          PAGE76_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.PAGE76_MODE || 'dry_run' }}
          PAGE76_NOVEL_ENABLED: ${{ vars.PAGE76_NOVEL_ENABLED }}
          PAGE76_NOVEL_PUBLISH_ENABLED: ${{ vars.PAGE76_NOVEL_PUBLISH_ENABLED }}
          PAGE76_NOVEL_PUBLISH_HHMM: ${{ vars.PAGE76_NOVEL_PUBLISH_HHMM }}
          PAGE76_PUBLISH_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'probe' && 'true' || 'false' }}
          PAGE76_NOVEL_START: ${{ vars.PAGE76_NOVEL_START }}
          PAGE76_NOVEL_TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAGE76_NOVEL_TG_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          PAGE76_NOVEL_PROMPT_PAGE_ID: ${{ secrets.PAGE76_NOVEL_PROMPT_PAGE_ID }}
          PAGE76_BANNED_TERMS: ${{ secrets.PAGE76_BANNED_TERMS }}
          FACE_PAGE76_ID: ${{ secrets.FACE_PAGE76_ID }}
          FACE_PAGE76_TOKEN: ${{ secrets.FACE_PAGE76_TOKEN }}
          PAGE76_NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE76_DB05_ID: ${{ secrets.PAGE76_DB05_ID }}
          PAGE76_DB11_ID: ${{ secrets.PAGE76_DB11_ID }}
          PAGE76_DB12_ID: ${{ secrets.PAGE76_DB12_ID }}
          PAGE76_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAGE76_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          PAGE76_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python -m p76.run_novel_publish

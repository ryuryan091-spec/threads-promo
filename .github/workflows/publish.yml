name: Threads Publish

"on":
  schedule:
    # v1.3.0: 슬롯 3개 → 7개 (config.PUBLISH_SLOT_TIMES 와 1:1, verify_repo 검사 5·8).
    #   하루 하나만 실제 발행(날짜 시드 추첨) + 발행 전 1~20분 랜덤 지연.
    #   KST D 07:14 / A 08:09 / B 12:26 / E 15:07 / F 16:36 / C 19:53 / G 21:43
    #   판정 창(+47분)은 이벤트(03:11/13:29/17:41/23:17 +90분)와 겹치지 않는다.
    #   v1.5.0: CHAT 창(09:00~24:00)은 판정 창(+앞 5분)을 빼고 CHAT 구역을 정한다(chat_plan.chat_zones).
    - cron: "14 22 * * *"
    - cron: "9 23 * * *"
    - cron: "26 3 * * *"
    - cron: "7 6 * * *"
    - cron: "36 7 * * *"
    - cron: "53 10 * * *"
    - cron: "43 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [dry_run, live]
        default: dry_run

permissions:
  contents: read

concurrency:
  group: threads-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # v1.3.0: 발행 전 지연 최대 20분 + 컨테이너 대기 최대 5분×3(이미지·텍스트 폴백·링크 리플) + 준비 여유
    steps:
      - uses: actions/checkout@v4
        with:
          # BUILD 기둥 제거로 커밋 로그는 현재 미사용.
          # 기둥을 되살릴 때를 대비해 depth 는 유지한다(비용 없음).
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resolve slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "14 22 * * *") echo "slot=D" >> "$GITHUB_OUTPUT" ;;
            "9 23 * * *")  echo "slot=A" >> "$GITHUB_OUTPUT" ;;
            "26 3 * * *")  echo "slot=B" >> "$GITHUB_OUTPUT" ;;
            "7 6 * * *")   echo "slot=E" >> "$GITHUB_OUTPUT" ;;
            "36 7 * * *")  echo "slot=F" >> "$GITHUB_OUTPUT" ;;
            "53 10 * * *") echo "slot=C" >> "$GITHUB_OUTPUT" ;;
            "43 12 * * *") echo "slot=G" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=MANUAL" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_LONG_LIVED_TOKEN: ${{ secrets.THREADS_LONG_LIVED_TOKEN }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          TOKEN_ISSUED_AT: ${{ vars.TOKEN_ISSUED_AT }}
          TOKEN_REFRESHED_AT: ${{ secrets.TOKEN_REFRESHED_AT }}
          CLAUDE_AI_KEY: ${{ secrets.CLAUDE_AI_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_FIELD_ALLOWLIST: ${{ vars.NOTION_FIELD_ALLOWLIST }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          AI_ENABLED: ${{ vars.AI_ENABLED || 'true' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          PILLAR_ROTATION_OVERRIDE: ${{ vars.PILLAR_ROTATION_OVERRIDE }}
          PILLAR_ROTATION_AUTO: ${{ vars.PILLAR_ROTATION_AUTO }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          X_URL: ${{ vars.X_URL }}
          ASSET_RAW_BASE_URL: ${{ vars.ASSET_RAW_BASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_SLOTS: "A,B,C,D,E,F,G"
          PUBLISH_WEEKLY_REST_DAYS: ${{ vars.PUBLISH_WEEKLY_REST_DAYS || '0' }}
          SLOT: ${{ steps.slot.outputs.slot }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'live' && 'false' || 'true') || (vars.DRY_RUN || 'true') }}
        run: python -m src.main

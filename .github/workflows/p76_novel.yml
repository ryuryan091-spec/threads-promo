# ─────────────────────────────────────────────────────────────
#  사건파일76 사건 소설(B형) — 원고 자동 작성·묵시 승인 (DSN-P76-NOVEL-002 · DN2026_0072)
#  게시는 p76_novel_publish.yml 이 따로 맡는다(이 워크플로는 Facebook 토큰을 받지 않는다)
#
#  ⚠️ cron 은 UTC. 2시간 간격, CHAT 트리거와 6분 이상 (STD-SCHED-01 — 시각을 바꾸면 이 주석도 함께 수정)
#    "50 23 * * *" = KST 08:50   "44 1 * * *" = KST 10:44   "44 3 * * *" = KST 12:44   "44 5 * * *" = KST 14:44
#    "44 7 * * *"  = KST 16:44   "44 9 * * *" = KST 18:44   "25 11 * * *" = KST 20:25  "15 13 * * *" = KST 22:15
#  모드(STD-MODE-02): 수동 실행 = inputs.mode / 스케줄 = vars.PAGE76_MODE → 미설정 시 dry_run
#  스위치: PAGE76_ENABLED + PAGE76_NOVEL_ENABLED (전역 중단) · 중단 = DB-12 중단 체크
#  Secret: Anthropic 키는 기존 CLAUDE_AI_KEY 재사용(DN2026_0071, D-N3 대체) · 노션은 기존 NOTION_TOKEN(DN2026_0070)
#          · 텔레그램은 기존 운영 알림 봇·방(DN2026_0072, 보내기만 — getUpdates 없음)
#  보안(SEC RR-06): main 브랜치에서만 · 공개 로그에는 키·상태·코드·비용만 (원고·프롬프트·노션 ID 없음)
# ─────────────────────────────────────────────────────────────
name: 📕 p76-novel

on:
  schedule:
    - cron: "50 23 * * *"
    - cron: "44 1 * * *"
    - cron: "44 3 * * *"
    - cron: "44 5 * * *"
    - cron: "44 7 * * *"
    - cron: "44 9 * * *"
    - cron: "25 11 * * *"
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run=합성 응답·쓰기 없음 · shadow=생성·노션·텔레그램 · live=게시 포함"
        type: choice
        options: ["dry_run", "shadow", "live"]
        default: "dry_run"

concurrency:
  group: p76-novel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --require-hashes -r p76/requirements.txt -r p76/requirements-novel.txt
      - name: Run
        env:
          PAGE76_ENABLED: ${{ vars.PAGE76_ENABLED }}
          PAGE76_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.PAGE76_MODE || 'dry_run' }}
          PAGE76_NOVEL_ENABLED: ${{ vars.PAGE76_NOVEL_ENABLED }}
          PAGE76_NOVEL_START: ${{ vars.PAGE76_NOVEL_START }}
          PAGE76_NOVEL_BUDGET_USD: ${{ vars.PAGE76_NOVEL_BUDGET_USD }}
          PAGE76_CLAUDE_KEY: ${{ secrets.CLAUDE_AI_KEY }}
          PAGE76_NOVEL_TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAGE76_NOVEL_TG_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          PAGE76_NOVEL_PROMPT_PAGE_ID: ${{ secrets.PAGE76_NOVEL_PROMPT_PAGE_ID }}
          PAGE76_NOVEL_MEMO_PAGE_ID: ${{ secrets.PAGE76_NOVEL_MEMO_PAGE_ID }}
          PAGE76_BANNED_TERMS: ${{ secrets.PAGE76_BANNED_TERMS }}
          PAGE76_NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE76_DB05_ID: ${{ secrets.PAGE76_DB05_ID }}
          PAGE76_DB11_ID: ${{ secrets.PAGE76_DB11_ID }}
          PAGE76_DB12_ID: ${{ secrets.PAGE76_DB12_ID }}
          PAGE76_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAGE76_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: python -m p76.run_novel

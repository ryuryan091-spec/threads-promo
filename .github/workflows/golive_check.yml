name: Threads Go-Live Check

# live 전환 전 점검. 읽기 전용 — Threads 에 아무것도 쓰지 않는다.
# 스케줄 없음. 수동 실행만.
# 결과는 Actions 요약(Summary)에 표로 남는다. FAIL 이 있으면 실패로 끝난다.

"on":
  workflow_dispatch:
    inputs:
      web_search:
        description: "Claude 웹 검색 1회 실제 호출 (검색 1회 과금)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Go-Live Check
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_LONG_LIVED_TOKEN: ${{ secrets.THREADS_LONG_LIVED_TOKEN }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          TOKEN_ISSUED_AT: ${{ vars.TOKEN_ISSUED_AT }}
          TOKEN_REFRESHED_AT: ${{ secrets.TOKEN_REFRESHED_AT }}
          CLAUDE_AI_KEY: ${{ secrets.CLAUDE_AI_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          X_URL: ${{ vars.X_URL }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          CHAT_ENABLED: ${{ vars.CHAT_ENABLED || 'false' }}
          CHAT_DAILY_MIN: ${{ vars.CHAT_DAILY_MIN || '6' }}
          CHAT_DAILY_MAX: ${{ vars.CHAT_DAILY_MAX || '8' }}
          CHAT_WEEKEND_MIN: ${{ vars.CHAT_WEEKEND_MIN || '2' }}
          CHAT_WEEKEND_MAX: ${{ vars.CHAT_WEEKEND_MAX || '3' }}
          CHAT_SOURCE_MODE: ${{ vars.CHAT_SOURCE_MODE || 'mix' }}
          MOOD_RSS_URLS: ${{ vars.MOOD_RSS_URLS }}
          MOOD_WEB_MAX_USES: ${{ vars.MOOD_WEB_MAX_USES || '2' }}
          REPLY_ENABLED: ${{ vars.REPLY_ENABLED || 'true' }}
          EVENT_STORY_ENABLED: ${{ vars.EVENT_STORY_ENABLED || 'false' }}
          ADAPTIVE_WEIGHTS_ENABLED: ${{ vars.ADAPTIVE_WEIGHTS_ENABLED || 'false' }}
          PILLAR_ROTATION_OVERRIDE: ${{ vars.PILLAR_ROTATION_OVERRIDE }}
          PILLAR_ROTATION_AUTO: ${{ vars.PILLAR_ROTATION_AUTO }}
          LAST_WEIGHT_ADJUST: ${{ vars.LAST_WEIGHT_ADJUST }}
        run: |
          if [ "${{ inputs.web_search }}" = "true" ]; then
            python scripts/golive_check.py --web-search
          else
            python scripts/golive_check.py
          fi

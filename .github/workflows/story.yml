name: Threads Story Event

# EDT 회차가 트래커에 올라오면 그 회차를 근거로 STORY 를 발행한다.
# 신규 판정은 created_time 시간창(무상태). 대부분의 실행은 즉시 종료된다.
#
# EVENT_STORY_ENABLED=false 이면 아무것도 하지 않는다. 기본값은 false.

"on":
  schedule:
    # KST 03:11 / 13:29 / 17:41 / 23:17
    #   정기 발행 슬롯(08:23 / 12:47 / 20:31) '직전'을 피해 배치한다.
    #   게이트는 아직 발행되지 않은 정기 글을 볼 수 없으므로,
    #   직전에 돌면 최소 간격 조건이 무력화된다.
    - cron: "11 18 * * *"
    - cron: "29 4 * * *"
    - cron: "41 8 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [dry_run, live]
        default: dry_run

permissions:
  contents: read

concurrency:
  group: threads-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish story event
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_LONG_LIVED_TOKEN: ${{ secrets.THREADS_LONG_LIVED_TOKEN }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          CLAUDE_AI_KEY: ${{ secrets.CLAUDE_AI_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
          NOTION_FIELD_ALLOWLIST: ${{ vars.NOTION_FIELD_ALLOWLIST }}
          NOTION_STATUS_PROPERTY: ${{ vars.NOTION_STATUS_PROPERTY }}
          NOTION_STATUS_VALUE: ${{ vars.NOTION_STATUS_VALUE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          X_URL: ${{ vars.X_URL }}
          TOKEN_ISSUED_AT: ${{ vars.TOKEN_ISSUED_AT }}
          EVENT_STORY_ENABLED: ${{ vars.EVENT_STORY_ENABLED || 'false' }}
          EVENT_WINDOW_HOURS: ${{ vars.EVENT_WINDOW_HOURS || '7.2' }}
          EVENT_DAILY_CAP: ${{ vars.EVENT_DAILY_CAP || '2' }}
          EVENT_MIN_GAP_HOURS: ${{ vars.EVENT_MIN_GAP_HOURS || '4' }}
          EVENT_RUN: "true"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'live' && 'false' || vars.DRY_RUN || 'true' }}
        run: python -m src.run_story

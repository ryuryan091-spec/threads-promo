name: Threads Token Refresh

# 토큰 갱신 전용. 매일 확인하되 만료 임계(D-10)에서만 실제로 갱신한다.
#
# 매일 실행해도 비용이 없다. 잔여 일수는 날짜 계산으로 나오므로
# 임계 미달이면 API 호출 0회로 즉시 종료한다.
#
# 실제 갱신은 약 50일에 1회. 임계 진입 후 10회의 재시도 기회가 생긴다.
# 주 1회 방식은 실패 시 다음 기회가 7일 뒤라 위험했다.

"on":
  schedule:
    # 매일 KST 04:23 (다른 워크플로우와 겹치지 않는 시각)
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "임계와 무관하게 강제 갱신"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: threads-token-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh token
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_LONG_LIVED_TOKEN: ${{ secrets.THREADS_LONG_LIVED_TOKEN }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TOKEN_ISSUED_AT: ${{ vars.TOKEN_ISSUED_AT }}
          TOKEN_REFRESHED_AT: ${{ secrets.TOKEN_REFRESHED_AT }}
          REFRESH_ON_EVERY_RUN: "true"
          TOKEN_REFRESH_THRESHOLD_DAYS: ${{ vars.TOKEN_REFRESH_THRESHOLD_DAYS || '10' }}
          FORCE_REFRESH: ${{ inputs.force || 'false' }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          X_URL: ${{ vars.X_URL }}
        run: python -m src.run_refresh

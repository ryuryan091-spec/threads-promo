# ─────────────────────────────────────────────────────────────
#  사건파일76 휴재 콘텐츠 게시 (DB-09 승인 건 → 페이지 FB 예약 게시, DN2026_0119 §6-5)
#
#  게시 시각 T = 날짜 KST 20:05 + 결정적 지터 0~40분(캘린더키 해시) — FB 예약이 지킨다. 실행은 예약 등록(T 15분~36시간 전)과
#  T 경과 후 게시 확인만 하므로 매일 3회, 예약 실행 지연과 무관하다(무작위 대기 step 제거).
#  ⚠️ cron 은 UTC. 다른 워크플로·CHAT 트리거와 6분 이상 (STD-SCHED-01 — 시각을 바꾸면 이 주석도 함께 수정)
#    "48 2 * * *"  = KST 매일 11:48     "33 10 * * *" = KST 매일 19:33     "3 22 * * *"  = KST 매일 07:03
#  모드(STD-MODE-02): 수동 실행 = inputs.mode / 스케줄 = vars.PAGE76_MODE → 미설정 시 dry_run
#  threads-promo 통합 운영(DN2026_0069, 공개 레포 위험 수용) — p76/ 패키지만 실행, src/ 와 설정 공유 없음
#  Secret: 노션·텔레그램은 threads-promo 기존 NOTION_TOKEN · TELEGRAM_BOT_TOKEN · TELEGRAM_ALERT_CHAT_ID 재사용(DN2026_0070)
#  보안(SEC RR-06): Repository Secret + main 브랜치에서만 실행 · 로그는 공개되므로 날짜·회차·상태·코드만 출력
# ─────────────────────────────────────────────────────────────
name: 📕 p76-hiatus-publish

on:
  schedule:
    - cron: "48 2 * * *"
    - cron: "33 10 * * *"
    - cron: "3 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run=쓰기 없음 · shadow=검사·렌더 + 실행 기록 · live=예약 게시"
        type: choice
        options: ["dry_run", "shadow", "live"]
        default: "dry_run"

concurrency:
  group: p76-db09
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --require-hashes -r p76/requirements.txt
      - name: Install Korean fonts (card render)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Run
        env:
          PAGE76_ENABLED: ${{ vars.PAGE76_ENABLED }}
          PAGE76_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.PAGE76_MODE || 'dry_run' }}
          FACE_PAGE76_ID: ${{ secrets.FACE_PAGE76_ID }}
          FACE_PAGE76_TOKEN: ${{ secrets.FACE_PAGE76_TOKEN }}
          PAGE76_NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE76_DB05_ID: ${{ secrets.PAGE76_DB05_ID }}
          PAGE76_DB08_ID: ${{ secrets.PAGE76_DB08_ID }}
          PAGE76_DB09_ID: ${{ secrets.PAGE76_DB09_ID }}
          PAGE76_DB11_ID: ${{ secrets.PAGE76_DB11_ID }}
          PAGE76_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAGE76_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          PAGE76_HIATUS_PUBLISH_ENABLED: ${{ vars.PAGE76_HIATUS_PUBLISH_ENABLED }}
          PAGE76_BANNED_TERMS: ${{ secrets.PAGE76_BANNED_TERMS }}
          PAGE76_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python -m p76.run_hiatus_publish

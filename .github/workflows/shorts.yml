name: 📘🧵 Meta Shorts (Facebook · Threads)

# v1.7.0 60초 숏폼 — Facebook 페이지 릴스 + Threads 동영상 (DESIGN_V17_SHORTS.md)
#   build   : 영상 생성 + 텔레그램 미리보기. Meta 쓰기 없음.
#   publish : build 직후 자동 실행. 그날 분량을 채널별 시간대 안에서 간격을 두고 게시.
#
# DN2026_0002 (2026-10-05 마스터 결정) — ICG 웹툰 X 발행(월~토 KST 06:06)에 맞춤
#   - build cron  : 매일 KST 08:19 → 월~토 KST 05:06 (일요일 휴식 고정, 무작위 휴식일 폐지)
#   - 승인 게이트 : environment 'meta-publish' 제거 → 완전 자동 게시
#   - 게시 시간대 : Facebook 06:06~22:00(첫 편 +5~40분) / Threads 10:00~22:00 유지 (src/config.py)
#   - build 는 영상 생성 시간을 고려해 게시 하한(06:06)보다 1시간 먼저 시작한다.
#   - 차단 스위치는 그대로: DRY_RUN · AUTOMATION_ENABLED · FACE_ENABLED · SHORTS_BUILD_ENABLED
#
# DN2026_0003 (2026-10-05 마스터 결정) — 발행 거래 분리
#   - Facebook 게시는 별도 워크플로 face_publish.yml(📘 Facebook Reels Publish)이 수행한다.
#   - 이 워크플로의 publish job 은 Threads 동영상만 게시한다(SHORTS_PUBLISH_CHANNELS=threads).
#   - build 성공 후 dispatch_face job 이 face_publish.yml 을 이 실행 ID 로 기동한다
#     (GITHUB_TOKEN 으로 기동 가능한 이벤트는 workflow_dispatch — GitHub 문서 기준).
#     → Threads 가 10시대까지 대기해도 Facebook 은 06:06 시간대에 독립적으로 게시된다.
# Facebook 전용 값은 FACE_ 접두(Threads 와 공유하지 않는 값).

"on":
  schedule:
    # DN2026_0002 : "19 23 * * *"(매일 KST 08:19) → UTC 일~금 20:06 = KST 월~토 05:06
    - cron: "6 20 * * 0-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 모드"
        type: choice
        options: [dry_run, live]
        default: dry_run

permissions:
  contents: read

# 동시 실행 그룹은 job 단위로 둔다(점검 2026-10-04).
#   워크플로 단위로 두면 승인 대기 중인 publish 가 그룹을 붙잡아 다음 날 build 까지 막힌다.
#   publish 는 cancel-in-progress: true — 새 실행이 오면 지난 날 승인 대기분은 취소된다(지난 영상은 어차피 게시 안 함).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: threads-shorts-build
      cancel-in-progress: false
    outputs:
      has_items: ${{ steps.manifest.outputs.has_items }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 기본 러너 이미지(ubuntu-24.04)에는 ffmpeg·한글 폰트가 없다(runner-images 목록 확인).
      - name: Install ffmpeg and Korean font
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - run: pip install -r requirements.txt

      - name: Build shorts
        env:
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'false' }}
          WARMUP_UNTIL: ${{ vars.WARMUP_UNTIL }}
          SHORTS_BUILD_ENABLED: ${{ vars.SHORTS_BUILD_ENABLED || 'false' }}
          SHORTS_THREADS_ENABLED: ${{ vars.SHORTS_THREADS_ENABLED || 'false' }}
          FACE_ENABLED: ${{ vars.FACE_ENABLED || 'false' }}
          FACE_RAMP_START: ${{ vars.FACE_RAMP_START }}
          FACE_DAILY_MAX: ${{ vars.FACE_DAILY_MAX || '3' }}
          # DN2026_0002 : 기본값 '1' → '0' (휴식일은 cron 일요일 제외로 고정)
          SHORTS_WEEKLY_REST_DAYS: ${{ vars.SHORTS_WEEKLY_REST_DAYS || '0' }}
          SHORTS_IMAGE_MODEL: ${{ vars.SHORTS_IMAGE_MODEL }}
          SHORTS_TTS_MODEL: ${{ vars.SHORTS_TTS_MODEL }}
          SHORTS_TTS_VOICE: ${{ vars.SHORTS_TTS_VOICE }}
          CLAUDE_AI_KEY: ${{ secrets.CLAUDE_AI_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          GEMINI_API_SUB_PAY_KEY: ${{ secrets.GEMINI_API_SUB_PAY_KEY }}
          # v1.8.0 Facebook 회차 원장(읽기 전용) — 기존 Tracker DB(NOTION_DB_ID)와 다른 DB
          FACE_STORY_ENABLED: ${{ vars.FACE_STORY_ENABLED || 'false' }}
          FACE_STORY_LOOKBACK: ${{ vars.FACE_STORY_LOOKBACK }}
          FACE_THREAD_MAX_EPISODES: ${{ vars.FACE_THREAD_MAX_EPISODES }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FACE_NOTION_DB_ID: ${{ secrets.FACE_NOTION_DB_ID }}
          CHAT_SOURCE_MODE: ${{ vars.CHAT_SOURCE_MODE || 'mix' }}
          MOOD_RSS_URLS: ${{ vars.MOOD_RSS_URLS }}
          MOOD_WEB_MAX_USES: ${{ vars.MOOD_WEB_MAX_USES || '2' }}
          X_URL: ${{ vars.X_URL }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          SHORTS_OUT_DIR: out/shorts
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'live' && 'false' || 'true') || (vars.DRY_RUN || 'true') }}
        run: python -m src.run_shorts_build

      - name: Manifest
        id: manifest
        if: always()
        run: |
          if [ -f out/shorts/manifest.json ] && python -c "import json,sys; sys.exit(0 if json.load(open('out/shorts/manifest.json'))['items'] else 1)"; then
            echo "has_items=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_items=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: steps.manifest.outputs.has_items == 'true'
        with:
          name: shorts
          path: |
            out/shorts/manifest.json
            out/shorts/*/video.mp4
            out/shorts/*/script.json
          retention-days: 3

  # DN2026_0003 : Facebook 게시 파이프라인(face_publish.yml) 기동 — build 산출물(artifact) 기준
  dispatch_face:
    needs: build
    if: needs.build.outputs.has_items == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # workflow_dispatch 기동
    steps:
      - name: Dispatch face_publish.yml
        env:
          GH_TOKEN: ${{ github.token }}
          # 정기 실행은 Variables DRY_RUN, 수동 실행은 inputs.mode 를 그대로 넘긴다
          FACE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || ((vars.DRY_RUN || 'true') == 'false' && 'live' || 'dry_run') }}
        run: |
          gh workflow run face_publish.yml \
            --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            -f mode="$FACE_MODE" -f build_run_id="${{ github.run_id }}" \
            -f timing=window -f target_date=""
          echo "face_publish.yml 기동: mode=$FACE_MODE build_run_id=${{ github.run_id }}"

  publish:
    needs: build
    if: needs.build.outputs.has_items == 'true'
    runs-on: ubuntu-latest
    # DN2026_0002 : 승인 게이트(environment: meta-publish) 제거 — build 직후 자동 게시
    concurrency:
      group: threads-shorts-publish
      cancel-in-progress: true
    # 편간 대기(최대 SHORTS_JOB_BUDGET_MIN=330분) + 업로드·처리 대기
    timeout-minutes: 350
    permissions:
      contents: write   # Threads 동영상 공개 URL 용 shorts-media 브랜치 강제 푸시
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: shorts
          path: out/shorts

      - name: Publish shorts
        env:
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED || 'false' }}
          DAILY_POST_BUDGET: ${{ vars.DAILY_POST_BUDGET || '2' }}
          WARMUP_UNTIL: ${{ vars.WARMUP_UNTIL }}
          SHORTS_THREADS_ENABLED: ${{ vars.SHORTS_THREADS_ENABLED || 'false' }}
          FACE_ENABLED: ${{ vars.FACE_ENABLED || 'false' }}
          FACE_RAMP_START: ${{ vars.FACE_RAMP_START }}
          FACE_DAILY_MAX: ${{ vars.FACE_DAILY_MAX || '3' }}
          FACE_PAGE_ID: ${{ secrets.FACE_PAGE_ID }}
          FACE_PAGE_TOKEN: ${{ secrets.FACE_PAGE_TOKEN }}
          # v1.8.0 Facebook 회차 원장(게시 결과 기록 · 재조정)
          FACE_STORY_ENABLED: ${{ vars.FACE_STORY_ENABLED || 'false' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FACE_NOTION_DB_ID: ${{ secrets.FACE_NOTION_DB_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_LONG_LIVED_TOKEN: ${{ secrets.THREADS_LONG_LIVED_TOKEN }}
          PUBLISH_WEEKLY_REST_DAYS: ${{ vars.PUBLISH_WEEKLY_REST_DAYS || '0' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          SHORTS_OUT_DIR: out/shorts
          # DN2026_0003 : 이 job 은 Threads 동영상만 게시 (Facebook 은 face_publish.yml)
          SHORTS_PUBLISH_CHANNELS: threads
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'live' && 'false' || 'true') || (vars.DRY_RUN || 'true') }}
        run: python -m src.run_shorts_publish

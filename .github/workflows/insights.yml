name: Threads Insights

# 인사이트 수집. 읽기 전용이며 Threads 에 아무것도 쓰지 않는다.
# 발행과 완전히 독립되어 있어 실패해도 발행을 막지 않는다.

"on":
  schedule:
    # KST 23:47 — 하루 마감 후, 답글 슬롯(22:07) 이후
    - cron: "47 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: threads-insights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect insights
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_LONG_LIVED_TOKEN: ${{ secrets.THREADS_LONG_LIVED_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          YOUTUBE_URL: ${{ vars.YOUTUBE_URL }}
          X_URL: ${{ vars.X_URL }}
          INSIGHTS_ENABLED: ${{ vars.INSIGHTS_ENABLED || 'true' }}
          INSIGHTS_LOOKBACK_DAYS: ${{ vars.INSIGHTS_LOOKBACK_DAYS || '7' }}
          INSIGHTS_POST_LIMIT: ${{ vars.INSIGHTS_POST_LIMIT || '70' }}
          PILLAR_ROTATION_OVERRIDE: ${{ vars.PILLAR_ROTATION_OVERRIDE }}
          PILLAR_ROTATION_AUTO: ${{ vars.PILLAR_ROTATION_AUTO }}
        run: python -m src.run_insights

# ─────────────────────────────────────────────────────────────
#  사건파일76 댓글 자동 숨김 (DN2026_0119 A3 · DSN-P76-NOVEL-003 §7 · p76/run_moderate.py)
#
#  최근 72시간 p76 게시물(소설 DB-12 게시완료 · 휴재 DB-09 발행완료) 댓글 중 금칙어 포함 → 숨김(is_hidden)만.
#  답글·삭제·차단·DM 없음(DN2026_0068). 토큰 권한(pages_manage_engagement 등) 확인 전까지 Variable 로 끈 채 배포.
#  ⚠️ cron 은 UTC. 다른 워크플로·CHAT 트리거와 6분 이상 (STD-SCHED-01 — 시각을 바꾸면 이 주석도 함께 수정)
#    "38 0 * * *"  = KST 매일 09:38     "23 6 * * *"  = KST 매일 15:23
#    "8 12 * * *"  = KST 매일 21:08     "53 18 * * *" = KST 매일 03:53
#  모드(STD-MODE-02): 수동 실행 = inputs.mode / 스케줄 = vars.PAGE76_MODE → 미설정 시 dry_run
#  스위치: PAGE76_ENABLED + PAGE76_MODERATE_ENABLED
#  보안(SEC RR-06): main 브랜치에서만 · 공개 로그·DB-11 에는 건수만 (댓글 본문·작성자·ID 없음)
# ─────────────────────────────────────────────────────────────
name: 📕 p76-moderate

on:
  schedule:
    - cron: "38 0 * * *"
    - cron: "23 6 * * *"
    - cron: "8 12 * * *"
    - cron: "53 18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run=쓰기 없음 · shadow=판정 건수 + 실행 기록 · live=숨김"
        type: choice
        options: ["dry_run", "shadow", "live"]
        default: "dry_run"

concurrency:
  group: p76-moderate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --require-hashes -r p76/requirements.txt
      - name: Run
        env:
          PAGE76_ENABLED: ${{ vars.PAGE76_ENABLED }}
          PAGE76_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || vars.PAGE76_MODE || 'dry_run' }}
          PAGE76_MODERATE_ENABLED: ${{ vars.PAGE76_MODERATE_ENABLED }}
          PAGE76_BANNED_TERMS: ${{ secrets.PAGE76_BANNED_TERMS }}
          FACE_PAGE76_ID: ${{ secrets.FACE_PAGE76_ID }}
          FACE_PAGE76_TOKEN: ${{ secrets.FACE_PAGE76_TOKEN }}
          PAGE76_NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PAGE76_DB09_ID: ${{ secrets.PAGE76_DB09_ID }}
          PAGE76_DB11_ID: ${{ secrets.PAGE76_DB11_ID }}
          PAGE76_DB12_ID: ${{ secrets.PAGE76_DB12_ID }}
          PAGE76_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PAGE76_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          PAGE76_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python -m p76.run_moderate

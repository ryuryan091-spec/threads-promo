name: Bootstrap Threads Token

# 최초 1회 또는 재인가 시 수동 실행한다.
# 토큰을 로그에 출력하지 않고 GitHub Secret에 직접 기록한다.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "리디렉션된 전체 URL을 그대로 붙여넣으십시오 (code 값만 넣어도 됨)"
        required: true
        type: string
      redirect_uri:
        description: "인가 시 사용한 Redirect URI (기본값 그대로 쓰면 됨)"
        required: true
        type: string
        default: "https://ryuryan091-spec.github.io/threads-promo/"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Issue and persist token
        env:
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GH_PAT_SECRETS_WRITE: ${{ secrets.GH_PAT_SECRETS_WRITE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 입력값은 run: 에 직접 삽입하지 않고 env 로 넘긴다(스크립트 인젝션 방지, GitHub 권고).
          INPUT_CODE: ${{ inputs.code }}
          INPUT_REDIRECT_URI: ${{ inputs.redirect_uri }}
        run: |
          python scripts/bootstrap_token.py \
            --code "$INPUT_CODE" \
            --redirect-uri "$INPUT_REDIRECT_URI" \
            --persist

      - name: Verify
        env:
          THREADS_LONG_LIVED_TOKEN: ${{ secrets.THREADS_LONG_LIVED_TOKEN }}
        run: |
          echo "주의: 이 스텝은 직전 스텝에서 갱신되기 전의 Secret 값을 봅니다."
          echo "정확한 검증은 이 워크플로우를 다시 실행하지 말고,"
          echo "Threads Publish 워크플로우를 DRY_RUN 으로 돌려서 확인하십시오."
